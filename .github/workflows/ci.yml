name: Check and Deploy
# Every push to develop, and every pull request into develop (e.g. Dependabot), runs the
# full check. Nothing is deployed.
# Pushing a version tag (vX.Y.Z, made by `npm run release`) runs the check and, only if it
# passes, deploys qr.open-waqf.org.
on:
    push:
        branches: [develop]
        tags: ["v*"]
        paths-ignore: # not applied to tag pushes
            - "**/*.md"
            - "LICENSE"
            - "docs/**"
    pull_request:
        branches: [develop]
        paths-ignore:
            - "**/*.md"
            - "LICENSE"
            - "docs/**"

# Read only by default. Only the deploy job below may write (older apps gave every run,
# pull requests included, write access).
permissions:
    contents: read

# A newer push to the same branch or tag cancels the older run.
concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

jobs:
    check:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7

            - uses: actions/setup-node@v7
              with:
                  node-version-file: ".nvmrc"
                  cache: "npm"

            - name: Tag matches the version in package.json
              if: startsWith(github.ref, 'refs/tags/v')
              run: |
                  VERSION=$(node -p "require('./package.json').version")
                  if [ "${GITHUB_REF_NAME}" != "v${VERSION}" ]; then
                    echo "Tag ${GITHUB_REF_NAME} does not match package.json version ${VERSION}"
                    exit 1
                  fi

            - run: npm ci

            - name: Cache Playwright browsers
              uses: actions/cache@v6
              id: playwright-cache
              with:
                  path: ~/.cache/ms-playwright
                  key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}

            - name: Install Playwright browsers
              if: steps.playwright-cache.outputs.cache-hit != 'true'
              run: npx playwright install --with-deps chromium

            - name: Install Playwright system libraries
              if: steps.playwright-cache.outputs.cache-hit == 'true'
              run: npx playwright install-deps chromium

            # The same command as on the computer: lint, typecheck, translations, unit tests with
            # coverage, production build, size budget, then every browser test (phone, Arabic,
            # desktop) against that build, with the network guard and axe.
            - name: Full check
              run: npm run check -- --desktop

            - name: Upload test report
              uses: actions/upload-artifact@v7
              if: failure()
              with:
                  name: playwright-report
                  path: |
                      playwright-report/
                      test-results/
                  retention-days: 7

            - name: Keep the build for the deploy job
              if: startsWith(github.ref, 'refs/tags/v')
              uses: actions/upload-artifact@v7
              with:
                  name: dist
                  path: dist/
                  retention-days: 1

    # The Android app, built in parallel with the check above. It catches what the web tests
    # cannot: a Capacitor or plugin update (Dependabot) that breaks the Gradle build, or a
    # library that adds a permission (INTERNET) or a tracker. The signed bundle for Google Play
    # is made on the computer (`npm run release`).
    android:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7

            - uses: actions/setup-node@v7
              with:
                  node-version-file: ".nvmrc"
                  cache: "npm"

            - uses: actions/setup-java@v6
              with:
                  distribution: temurin
                  java-version: "21"
                  cache: gradle

            - run: npm ci

            - name: Build the debug and release apps
              run: npm run android:build

            - name: No permissions, no trackers in the store build
              run: npm run check:android

    deploy:
        needs: [check, android]
        if: startsWith(github.ref, 'refs/tags/v')
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - uses: actions/checkout@v7

            - uses: actions/download-artifact@v7
              with:
                  name: dist
                  path: dist

            - run: echo "qr.open-waqf.org" > dist/CNAME

            - name: Deploy to the deploy branch (GitHub Pages)
              uses: JamesIves/github-pages-deploy-action@v4
              with:
                  folder: dist
                  branch: deploy
                  clean: true
                  git-config-name: "Open Waqf Bot"
                  git-config-email: "bot@open-waqf.org"
                  commit-message: "deploy: update just-qr (automated)"
