# Dependabot: one small batch of update pull requests per month, not a stream.
# Each pull request runs the full check on GitHub. Nothing is merged automatically.
version: 2
updates:
    - package-ecosystem: npm
      directory: "/"
      target-branch: develop
      schedule:
          interval: monthly
      open-pull-requests-limit: 5
      groups:
          # Capacitor core, android, cli and plugins must stay on the same minor.
          capacitor:
              patterns: ["@capacitor/*"]
          npm-minor-and-patch:
              update-types: [minor, patch]
      ignore:
          # TypeScript 7 ships no tsserver, so IntelliJ loses type checking (Signer, Lens).
          - dependency-name: typescript
            update-types: ["version-update:semver-major"]
          # @types/node follows the Node version on GitHub (.nvmrc). Move it with Node.
          - dependency-name: "@types/node"
            update-types: ["version-update:semver-major"]

    # Android build files (Gradle plugin, AndroidX). Capacitor's own Android code comes with npm.
    - package-ecosystem: gradle
      directory: "/android"
      target-branch: develop
      schedule:
          interval: monthly
      groups:
          gradle:
              patterns: ["*"]
      ignore:
          # Gradle 9 fails with the Android Gradle plugin 8.x that Capacitor 8 uses (tried
          # 2026-11-04: "Failed to apply plugin com.android.internal.application"). Move to
          # Gradle 9 together with Capacitor, when its Android template does.
          - dependency-name: gradle-wrapper
            update-types: ["version-update:semver-major"]
          - dependency-name: com.android.tools.build:gradle
            update-types: ["version-update:semver-major"]

    - package-ecosystem: github-actions
      directory: "/"
      target-branch: develop
      schedule:
          interval: monthly
      groups:
          github-actions:
              patterns: ["*"]
